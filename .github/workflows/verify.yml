name: 星镜双平台检查与打包
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starshot-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run version:check
      - name: Install the signature verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Verify version tooling and real signature rejection
        run: node --experimental-strip-types --test tests/release.test.ts
        env:
          STARSHOT_REQUIRE_MINISIGN: '1'
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: starshot-macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: starshot-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run version:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri icon public/starshot.svg
      - name: Build ordinary installers without updater secrets
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
