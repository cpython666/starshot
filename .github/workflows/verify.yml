name: 星镜双平台检查与打包
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: starshot-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run models:prepare
      - run: npm run version:check
      - name: Install the signature verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Verify version tooling and real signature rejection
        run: node --experimental-strip-types --test tests/release.test.ts
        env:
          STARSHOT_REQUIRE_MINISIGN: '1'
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: starshot-macos-apple-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: starshot-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run models:prepare
      - run: npm run version:check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri icon public/starshot.svg
      - name: Build ordinary installers without updater secrets
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify the offline OCR worker with original pixels
        if: runner.os == 'Windows'
        run: python tests/ocr-worker-smoke.py src-tauri/target/${{ matrix.target }}/release/starshot.exe
      - name: Fetch the pinned previous Windows release for upgrade verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'Starshot_0.3.0_x64-setup.exe'
          Invoke-WebRequest 'https://github.com/cpython666/starshot/releases/download/v0.3.0/Starshot_0.3.0_x64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne 'e437c0ac62f125c0947d9b7192a1e9d6c2500bb9d37437a526b8e399df39b0a1') { throw 'Previous release hash mismatch.' }
          "STARSHOT_PREVIOUS_INSTALLER=$previous" >> $env:GITHUB_ENV
      - name: Verify isolated Windows upgrade and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one final NSIS installer.' }
          ./tests/windows-installer-smoke.ps1 -InstallerPath $installers[0].FullName -PreviousInstallerPath $env:STARSHOT_PREVIOUS_INSTALLER
      - name: Preserve Windows installation evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-verify
          path: artifacts/windows-installer-smoke/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
