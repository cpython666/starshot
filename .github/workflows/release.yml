name: 星镜签名发布草稿
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.2.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: starshot-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Check the version and existing tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node scripts/version.mjs check "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { releaseNotes } from "./scripts/release-manifest.mjs"; releaseNotes(readFileSync("CHANGELOG.md", "utf8"), process.env.RELEASE_TAG.slice(1));'
      - run: npm ci --no-audit --no-fund
      - run: npm run models:prepare
      - name: Install the signature verifier for real signing tests
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - run: npm test
        env:
          STARSHOT_REQUIRE_MINISIGN: '1'
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
  desktop:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --no-audit --no-fund
      - run: npm run models:prepare
      - run: npm run version:check -- '${{ needs.validate.outputs.tag }}'
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri icon public/starshot.svg
      - name: Build installer and signed Tauri updater artifact
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY repository secret.' >&2
            exit 1
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          npm run tauri build -- --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Verify the offline OCR worker with original pixels
        if: runner.os == 'Windows'
        run: python tests/ocr-worker-smoke.py src-tauri/target/${{ matrix.target }}/release/starshot.exe
      - name: Fetch the pinned previous Windows release for upgrade verification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'Starshot_0.3.0_x64-setup.exe'
          Invoke-WebRequest 'https://github.com/cpython666/starshot/releases/download/v0.3.0/Starshot_0.3.0_x64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne 'e437c0ac62f125c0947d9b7192a1e9d6c2500bb9d37437a526b8e399df39b0a1') { throw 'Previous release hash mismatch.' }
          "STARSHOT_PREVIOUS_INSTALLER=$previous" >> $env:GITHUB_ENV
      - name: Verify isolated Windows upgrade and uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one final NSIS installer.' }
          ./tests/windows-installer-smoke.ps1 -InstallerPath $installers[0].FullName -PreviousInstallerPath $env:STARSHOT_PREVIOUS_INSTALLER
      - name: Preserve Windows installation evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-smoke-release
          path: artifacts/windows-installer-smoke/
          if-no-files-found: warn
      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict 'src-tauri/target/${{ matrix.target }}/release/bundle/macos/Starshot.app'
      - name: Collect the complete platform artifact set
        run: node scripts/release-manifest.mjs collect 'src-tauri/target/${{ matrix.target }}/release/bundle' release-assets '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  draft:
    needs: [validate, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded
      - name: Install the signature verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Verify both platforms and assemble the update feed
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: node scripts/release-manifest.mjs assemble downloaded release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: complete-release-${{ needs.validate.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
      - name: Create or reuse an empty draft, never overwrite an existing release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const body = fs.readFileSync('release-assets/release-notes.md', 'utf8');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) throw new Error('Refusing to overwrite a published release. Bump the version.');
            if (release) {
              if (release.assets.length) throw new Error('Draft already has assets. Review or remove that draft before retrying; existing files are never overwritten.');
              if (release.body !== body || release.name !== `星镜 ${tag}`) throw new Error('Existing draft metadata differs. Review or remove that draft before retrying.');
            } else {
              await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: process.env.RELEASE_REVISION, name: `星镜 ${tag}`, body, draft: true, prerelease: false });
            }
      - name: Upload verified files to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          echo 'Draft assembled. Review and test both platforms before manually publishing it as the latest release.' >> "$GITHUB_STEP_SUMMARY"
